<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bloch Sphere 3D Gates</title>
    <style>
      body {
        margin: 0;
        background: #0b1220;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px;
        border-radius: 8px;
        color: white;
        font-family: monospace;
      }
      button {
        margin: 2px;
        padding: 6px 10px;
        background: #00c2ff;
        border: none;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #0095cc;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button onclick="resetState()">|0⟩</button>
      <button onclick="setPlus()">|+⟩</button>
      <hr />
      <button onclick="applyGate('X')">X</button>
      <button onclick="applyGate('Y')">Y</button>
      <button onclick="applyGate('Z')">Z</button>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);
      const scene = new BABYLON.Scene(engine);

      const camera = new BABYLON.ArcRotateCamera(
        "cam",
        -Math.PI / 2,
        Math.PI / 3,
        4,
        BABYLON.Vector3.Zero(),
        scene,
      );
      camera.attachControl(canvas, true);
      new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(1, 1, 0),
        scene,
      );

      // Sphere
      const sphere = BABYLON.MeshBuilder.CreateSphere(
        "sphere",
        { diameter: 2, segments: 64 },
        scene,
      );
      const mat = new BABYLON.StandardMaterial("mat", scene);
      mat.alpha = 0.2;
      mat.wireframe = true;
      sphere.material = mat;

      // Axes
      const makeAxis = (points, color) => {
        const axis = BABYLON.MeshBuilder.CreateLines("axis", { points }, scene);
        axis.color = color;
      };
      makeAxis(
        [new BABYLON.Vector3(-1.5, 0, 0), new BABYLON.Vector3(1.5, 0, 0)],
        new BABYLON.Color3(1, 0, 0),
      );
      makeAxis(
        [new BABYLON.Vector3(0, -1.5, 0), new BABYLON.Vector3(0, 1.5, 0)],
        new BABYLON.Color3(0, 1, 0),
      );
      makeAxis(
        [new BABYLON.Vector3(0, 0, -1.5), new BABYLON.Vector3(0, 0, 1.5)],
        new BABYLON.Color3(0, 0, 1),
      );

      // Arrow
      const arrowMat = new BABYLON.StandardMaterial("arrowMat", scene);
      arrowMat.diffuseColor = new BABYLON.Color3(0, 1, 1);
      const arrow = BABYLON.MeshBuilder.CreateCylinder(
        "arrow",
        { height: 1, diameter: 0.05 },
        scene,
      );
      arrow.material = arrowMat;
      arrow.position.y = 0.5;
      const arrowHead = BABYLON.MeshBuilder.CreateSphere(
        "arrowHead",
        { diameter: 0.1 },
        scene,
      );
      arrowHead.material = arrowMat;
      arrowHead.position.y = 1.0;

      const stateGroup = new BABYLON.TransformNode("stateGroup");
      arrow.parent = stateGroup;
      arrowHead.parent = stateGroup;

      // State as 3D vector
      let state = new BABYLON.Vector3(0, 1, 0); // |0⟩ along +Y

      function updateArrow() {
        arrow.position = state.scale(0.5);
        arrowHead.position = state.clone();
      }

      // Reset / Plus
      function resetState() {
        state = new BABYLON.Vector3(0, 1, 0);
        updateArrow();
      }
      function setPlus() {
        state = new BABYLON.Vector3(1, 0, 0);
        updateArrow();
      }

      // Gates as quaternion rotations
      function rotateVector(v, axis, angle) {
        const q = BABYLON.Quaternion.RotationAxis(axis.normalize(), angle);
        return BABYLON.Vector3.TransformCoordinates(
          v,
          BABYLON.Matrix.FromQuaternion(q),
        );
      }

      function applyGate(gate) {
        switch (gate) {
          case "X":
            state = rotateVector(state, new BABYLON.Vector3(1, 0, 0), Math.PI);
            break;
          case "Y":
            state = rotateVector(state, new BABYLON.Vector3(0, 1, 0), Math.PI);
            break;
          case "Z":
            state = rotateVector(state, new BABYLON.Vector3(0, 0, 1), Math.PI);
            break;
        }
        updateArrow();
      }

      resetState();
      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    </script>
  </body>
</html>
