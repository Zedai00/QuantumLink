

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binary Decoder Animation</title>
  <style>
    body {
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #container {
      display: flex;
      align-items: center;
      height: 100vh;
      justify-content: center;
    }
    #inputBox {
      position: absolute;
      left: 20px;
      top: 40%;
      padding: 10px;
      background: #1e293b;
      border-radius: 8px;
    }
    #decoder {
      width: 150px;
      height: 150px;
      border: 3px solid #00f6ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      position: relative;
      background: #0f172a;
      box-shadow: 0 0 25px #00f6ff;
      z-index: 50;
    }
    .fly {
      position: absolute;
      font-size: 22px;
      transition: all 2s ease-in-out;
      white-space: nowrap;
    }
    .output {
      font-size: 28px;
      transition: all 3s linear;
    }
  </style>
</head>
<body>
  <div id="container">
    <input id="inputBox" type="text" placeholder="Enter binary (e.g. 01001000)" />
    <div id="decoder">Binary Decoder</div>
  </div>

  <script>
    const decoder = document.getElementById('decoder');
    const inputBox = document.getElementById('inputBox');

    function binaryToText(binaryStr) {
      const binaries = binaryStr.match(/.{1,8}/g) || [];
      return binaries.map(bin => String.fromCharCode(parseInt(bin, 2))).join('');
    }

    function animateBinary(binary) {
      const fly = document.createElement('div');
      fly.className = 'fly';
      fly.textContent = binary;
      document.body.appendChild(fly);

      const startX = 30;
      const startY = window.innerHeight / 2;
      fly.style.left = startX + 'px';
      fly.style.top = startY + 'px';

      const decoderRect = decoder.getBoundingClientRect();
      const destX = decoderRect.left + 30;
      const destY = decoderRect.top + decoderRect.height / 2;

      requestAnimationFrame(() => {
        fly.style.left = destX + 'px';
        fly.style.top = destY + 'px';
      });

      // After entering decoder → hide it
      setTimeout(() => {
        fly.remove();

        // Decode and output letter
        const outputLetter = document.createElement('div');
        outputLetter.className = 'fly output';
        outputLetter.textContent = binaryToText(binary);
        document.body.appendChild(outputLetter);

        // Start position = decoder center
        outputLetter.style.left = (decoderRect.left + decoderRect.width / 2) + 'px';
        outputLetter.style.top = (decoderRect.top + decoderRect.height / 2) + 'px';

        // Move to the right
        requestAnimationFrame(() => {
          outputLetter.style.left = window.innerWidth + 'px';
        });

        // Remove after 2 seconds
        setTimeout(() => {
          outputLetter.remove();
        }, 3000);

      }, 2000); // wait until binary reaches decoder
    }

    inputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const binaries = inputBox.value.trim().match(/.{1,8}/g);
        if (binaries) {
          let delay = 0;
          binaries.forEach(bin => {
            setTimeout(() => animateBinary(bin), delay);
            delay += 2500;
          });
        }
        inputBox.value = '';
      }
    });
  </script>
</body>
</html>
